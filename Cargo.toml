[package]
name = "stringbytes"
version = "0.0.3"
description = "A trait for byte sequences and UTF-8 strings"
authors = ["Yun Peng <pengyun.me@outlook.com>"]
edition = "2021"
rust-version = "1.95"
license = "MIT"
readme = "README.md"
repository = "https://github.com/WangLabCSU/stringbytes"
documentation = "https://docs.rs/stringbytes"
keywords = ["string", "bytes", "utf8"]
categories = ["text-processing"]
include = ["/src/**", "/benches/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
features = ["bytes"]

[features]
bytes = ["dep:bytes"]

[dependencies]
bytes = { version = "1.12.*", optional = true }

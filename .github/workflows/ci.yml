name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    # Match docs.rs features so links to optional bytes APIs can be checked.
    - name: Check documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --no-deps --features bytes --locked
    # Pin the generator so its output stays consistent across runs.
    - name: Install cargo-rdme
      run: cargo install cargo-rdme --version 2.2.3 --locked
    # Resolving rustdoc links requires the nightly version selected by cargo-rdme.
    - name: Install rustdoc toolchain for README links
      run: cargo rdme install-rust-toolchain-for-intralinks
    # Fail if README.md is out of sync with the crate documentation in src/lib.rs.
    - name: Check README
      run: cargo rdme --check

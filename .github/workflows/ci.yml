name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  test:
    name: Test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the minimum version in sync with package.rust-version.
        toolchain: ["1.95.0", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      # Both commands run unit tests and documentation examples.
      - name: Test default features
        run: cargo test --verbose --locked
      # Exercise the optional bytes implementations as well.
      - name: Test all features
        run: cargo test --verbose --all-features --locked

  lint:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and lint tools
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy with default features
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy with all features
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: Check default documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked
      # Check documentation with the same features as docs.rs.
      - name: Check docs.rs documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --features bytes --locked
      # Pin the generator so its output stays consistent across runs.
      - name: Install cargo-rdme
        run: cargo install cargo-rdme --version 2.2.3 --locked
      # Resolving rustdoc links requires the nightly version selected by cargo-rdme.
      - name: Install rustdoc toolchain for README links
        run: cargo rdme install-rust-toolchain-for-intralinks
      # Fail if README.md is out of sync with the crate documentation in src/lib.rs.
      - name: Check README
        run: cargo rdme --check
